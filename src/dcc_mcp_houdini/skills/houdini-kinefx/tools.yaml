tools:
  - name: create_insect_rig
    description: >-
      Create an anatomy-aware worker-honeybee KineFX skeleton with compound
      eyes, segmented antennae, a flexible abdomen, four wings, and six fully
      segmented legs ending in grounded claw joints.
    source_file: scripts/create_insect_rig.py
    execution: sync
    affinity: main
    group: rig
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      additionalProperties: false
      required: [geo_path]
      properties:
        geo_path: {type: string, minLength: 1, description: Geometry SOP container path.}
        rig_name: {type: string, default: honeybee_anatomy_rig}
        scale: {type: number, minimum: 0.001, maximum: 1000, default: 1.0}
        ground_z: {type: number, default: 0.0, description: Sole permitted ground height.}
        anatomy_measurements:
          type: object
          additionalProperties: false
          description: >-
            Optional measured world-space worker-honeybee dimensions. Each
            supplied dimension overrides the legacy uniform scale for its
            anatomical axis. A supplied body_width proportionally derives
            omitted head/abdomen widths, wing span, and leg span.
          properties:
            body_length:
              {type: number, minimum: 0.001, maximum: 100000, description: Head scape base to abdomen tip.}
            body_width:
              {type: number, minimum: 0.001, maximum: 100000, description: Thorax width at the forewing roots.}
            head_width:
              {type: number, minimum: 0.001, maximum: 100000, description: Widest left-to-right head span.}
            abdomen_width:
              {type: number, minimum: 0.001, maximum: 100000, description: Widest left-to-right abdomen span.}
            standing_height:
              {type: number, minimum: 0.001, maximum: 100000, description: Ground plane to forewing root height.}
            wing_span:
              {type: number, minimum: 0.001, maximum: 100000, description: Left-to-right forewing tip span.}
            leg_span:
              {type: number, minimum: 0.001, maximum: 100000, description: Left-to-right rear claw span.}
        auto_capture: {type: boolean, default: false}
        capture_mesh: {type: string, description: Optional mesh SOP name for auto-capture.}
  - name: create_rig
    description: >-
      Create a KineFX skeleton rig with a joint chain and optional
      auto-capture onto a mesh.
    source_file: scripts/create_rig.py
    execution: sync
    affinity: main
    group: rig
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      required: [geo_path]
      properties:
        geo_path:
          type: string
          description: Path to the Geometry SOP container (e.g. /obj/geo1).
        rig_name:
          type: string
          description: Name for the KineFX Skeleton SOP.
          default: "rig1"
        joint_chain:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Joint name.
              parent_index:
                type: integer
                minimum: -1
                description: Earlier parent joint index, or -1 for a root. Defaults to the previous joint.
              translate:
                type: array
                items: {type: number}
                minItems: 3
                maxItems: 3
                description: Joint position [x, y, z].
          description: List of joint definitions.
        auto_capture:
          type: boolean
          description: If true, capture and deform capture_mesh with KineFX SOPs.
          default: false
        capture_mesh:
          type: string
          description: Name of the mesh SOP node to capture onto.
  - name: set_rig_pose
    description: >-
      Set translation, rotation, and/or scale on one or all joints of a
      KineFX rig.
    source_file: scripts/set_rig_pose.py
    execution: sync
    affinity: main
    group: pose
    read_only: false
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
    input_schema:
      type: object
      required: [rig_node]
      properties:
        rig_node:
          type: string
          description: Path to the rig SOP node.
        joint_index:
          type: integer
          minimum: 0
          description: Zero-based joint point index.
        joint_name:
          type: string
          description: Name attribute value of the joint to modify.
        translate:
          type: array
          items: {type: number}
          minItems: 3
          maxItems: 3
          description: Translation [x, y, z] to set.
        rotate:
          type: array
          items: {type: number}
          minItems: 3
          maxItems: 3
          description: Rotation [rx, ry, rz] in degrees.
        scale:
          type: array
          items: {type: number}
          minItems: 3
          maxItems: 3
          description: Scale [sx, sy, sz] factors.
  - name: validate_ground_contacts
    description: >-
      Read named KineFX joint positions against the top of one cooked ground
      surface and report contact, lifted, penetrating, and missing joints.
      Passes only when no requested joint penetrates and the minimum stable
      support count is met.
    source_file: scripts/validate_ground_contacts.py
    execution: sync
    affinity: main
    group: pose
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
    input_schema:
      type: object
      required: [rig_node, ground_node, joint_names]
      properties:
        rig_node: {type: string, description: Cooked KineFX skeleton SOP path.}
        ground_node: {type: string, description: Cooked SOP path defining the only ground surface.}
        joint_names:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items: {type: string}
          description: Named support or lifted joints to validate.
        axis: {type: string, enum: [x, y, z], default: z}
        tolerance: {type: number, minimum: 0, default: 0.001, description: World-space contact tolerance.}
        min_support_contacts: {type: integer, minimum: 1, default: 3}
  - name: capture_joints
    description: >-
      Capture skinning weights from a KineFX skeleton onto a target mesh
      using captureproximity or bonecapture SOP.
    source_file: scripts/capture_joints.py
    execution: sync
    affinity: main
    group: capture
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      required: [geo_path, mesh_name, rig_name]
      properties:
        geo_path:
          type: string
          description: Path to the Geometry SOP container.
        mesh_name:
          type: string
          description: Name of the mesh SOP node to capture onto.
        rig_name:
          type: string
          description: Name of the rig SOP node (skeleton source).
        method:
          type: string
          description: Capture method.
          enum: [proximity, bones, heat]
          default: "proximity"
        max_joints:
          type: integer
          description: Maximum influencing joints per point.
          default: 4
        falloff:
          type: number
          description: Falloff distance multiplier.
          default: 1.0
        output_name:
          type: string
          description: Name for the capture SOP node (auto-generated if omitted).
  - name: deform_gsplat_with_rig
    description: >-
      Deform captured Gaussian Splat points with rest and animated KineFX
      skeletons while rotating quaternion orient and preserving anisotropic
      scale. Validates GSplat and boneCapture attributes first.
    source_file: scripts/deform_gsplat_with_rig.py
    execution: sync
    affinity: main
    group: capture
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      required: [geo_path, captured_splats, rest_rig, animated_rig]
      properties:
        geo_path: {type: string, description: Path to the Geometry SOP container.}
        captured_splats: {type: string, description: Captured GSplat SOP name with boneCapture.}
        rest_rig: {type: string, description: Rest-pose KineFX skeleton SOP name.}
        animated_rig: {type: string, description: Animated KineFX skeleton SOP name.}
        output_name: {type: string, default: deformed_gsplats, description: Joint Deform SOP name.}
        skinning_method:
          type: string
          enum: [linear, dual_quaternion, blend]
          default: dual_quaternion
          description: Joint Deform skinning method.
        deform_normals: {type: boolean, default: true, description: Deform N when present.}
        preserve_capture_attributes:
          type: boolean
          default: true
          description: Keep boneCapture for inspection and downstream validation.
  - name: apply_mocap
    description: >-
      Apply motion capture data (FBX, BVH, or KineFX .bclip/.clip) onto a
      rig skeleton.
    source_file: scripts/apply_mocap.py
    execution: async
    affinity: main
    timeout_hint_secs: 600
    group: mocap
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      required: [geo_path, rig_name, mocap_file]
      properties:
        geo_path:
          type: string
          description: Path to the Geometry SOP container.
        rig_name:
          type: string
          description: Name of the rig SOP node to animate.
        mocap_file:
          type: string
          description: Path to the mocap file (.fbx, .bvh, .bclip, .clip).
        start_frame:
          type: number
          description: Start frame offset for the mocap data.
        scale:
          type: number
          description: Uniform scale applied to the mocap data.
          default: 1.0
        mocap_node_name:
          type: string
          description: Name for the mocap import SOP node.
          default: "mocap1"
  - name: build_retarget_motion_mixer
    description: >-
      Build and cook a Houdini 22 Rig Match Pose, Map Points, Full Body IK,
      multi-MotionClip, APEX character, and Motion Mixer workflow from existing
      target and source KineFX skeleton SOPs. Returns every created node and
      node-level cook failures.
    source_file: scripts/build_retarget_motion_mixer.py
    execution: async
    affinity: main
    timeout_hint_secs: 600
    group: mocap
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      required: [geo_path, target_skeleton, source_skeletons]
      properties:
        geo_path: {type: string, description: Existing Geometry SOP container path.}
        target_skeleton: {type: string, description: Existing target KineFX skeleton SOP path.}
        source_skeletons:
          type: array
          minItems: 2
          items: {type: string}
          description: Two or more animated source KineFX skeleton SOP paths.
        character_name: {type: string, default: character}
        clip_names:
          type: array
          items: {type: string}
          description: One APEX clip name per source skeleton.
        start_frame: {type: integer, default: 1}
        end_frame: {type: integer, default: 96}
        mapping_attribute: {type: string, default: retarget_joint}
        node_prefix: {type: string, default: dcc_mcp_retarget}
        add_secondary_motion: {type: boolean, default: true}
        joint_map:
          type: object
          additionalProperties: {type: string}
          description: >-
            Optional explicit {source_joint_name: target_joint_name} map. When
            set, retargeting switches to explicit-attribute mapping so differently
            named biped skeletons can be retargeted.
        source_convention:
          type: string
          enum: [kinefx, biped, mixamo, unreal, fbx]
          description: >-
            Naming convention of the source skeletons; with target_convention
            derives the standard biped joint map automatically.
        target_convention:
          type: string
          enum: [kinefx, biped, mixamo, unreal, fbx]
          description: Naming convention of the target biped skeleton.
    next-tools:
      on-failure: [houdini_scene__get_node_info, houdini_render__capture_viewport]
  - name: plan_character_workflow
    description: >-
      Return the full eight-stage Houdini character-animation workflow design:
      stages, per-stage tools, gaps/enhancements, external (codex/hyper3d)
      capability status with offline equivalent alternatives, and acceptance
      criteria. Pure, headless tool for discovery/planning. See
      docs/guide/houdini-character-animation-workflow.md.
    source_file: scripts/plan_character_workflow.py
    execution: sync
    affinity: any
    group: workflow
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        codex_available:
          type: boolean
          description: Optional orchestrator probe result for the codex design capability.
        hyper3d_available:
          type: boolean
          description: Optional orchestrator probe result for the hyper3d generation capability.
  - name: design_character
    description: >-
      Emit or validate a structured character design spec (the offline
      equivalent of the external codex design step). Produces a strict JSON
      contract (style, proportions, naming convention, capture/retarget/ragdoll
      options) consumed by the rest of the workflow; validates externally
      authored specs. Pure, headless tool.
    source_file: scripts/design_character.py
    execution: sync
    affinity: any
    group: workflow
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, default: hero}
        style:
          type: string
          enum: [realistic, stylized, cartoon, stylized_game]
          default: stylized_game
        engine: {type: string, default: unreal}
        height: {type: number, minimum: 0.01, default: 1.7}
        naming_convention:
          type: string
          enum: [kinefx, biped, mixamo, unreal, fbx]
          default: kinefx
        face_forward: {type: string, default: "+Z"}
        up_axis: {type: string, enum: [Y, Z], default: Y}
        spec:
          type: object
          description: >-
            Optional externally authored design spec to validate instead of
            generating one. Must include name, target_height, naming_convention.
  - name: biped_joint_map
    description: >-
      Return an explicit biped joint-name map (source name -> target name)
      between two naming conventions (kinefx/biped/mixamo/unreal/fbx). Used to
      author the retarget_joint attribute for cross-convention KineFX retarget,
      rig inversion and APEX FBX biped template. Pure, headless tool.
    source_file: scripts/biped_joint_map.py
    execution: sync
    affinity: any
    group: workflow
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
    input_schema:
      type: object
      additionalProperties: false
      properties:
        source_convention:
          type: string
          enum: [kinefx, biped, mixamo, unreal, fbx]
          default: mixamo
        target_convention:
          type: string
          enum: [kinefx, biped, mixamo, unreal, fbx]
          default: kinefx
  - name: import_generated_character
    description: >-
      Import an externally generated character mesh (hyper3d/Rodin output:
      FBX/OBJ/ABC/bgeo/USD) into a SOP network, validate geometry, optionally
      normalize height, and report a rig-ready contract. Builds a procedural
      proxy when no file is present, so the workflow runs fully offline. This
      is the in-adapter equivalent of the external hyper3d generation step.
    source_file: scripts/import_generated_character.py
    execution: sync
    affinity: main
    group: workflow
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      additionalProperties: false
      properties:
        geo_path: {type: string, minLength: 1, description: Geometry SOP container path.}
        mesh_file:
          type: string
          description: Path to a generated character mesh (FBX/OBJ/ABC/bgeo/GLB/USD).
        node_name: {type: string, default: generated_character}
        target_height:
          type: number
          minimum: 0.01
          description: Optional height normalization target.
        proxy:
          type: boolean
          default: true
          description: Build a procedural proxy when the file is missing/uncookable.
        asset_descriptor:
          type: object
          description: >-
            Optional hyper3d AssetDescriptor (local_path / format / variants);
            its local mesh path is imported when mesh_file is unset.
    next-tools:
      on-failure: [houdini_scene__get_node_info, houdini_interchange__probe_file]
  - name: create_biped_template
    description: >-
      Create a standard 22-joint humanoid Biped KineFX skeleton template with
      stable joints across five naming conventions (kinefx/biped/mixamo/unreal/
      fbx), configurable height and ground. Fills workflow stage 3 (Biped
      template); the joint map feeds retarget, rig inversion and APEX FBX.
    source_file: scripts/create_biped_template.py
    execution: sync
    affinity: main
    group: rig
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      additionalProperties: false
      required: [geo_path]
      properties:
        geo_path: {type: string, minLength: 1, description: Geometry SOP container path.}
        rig_name: {type: string, default: biped}
        convention:
          type: string
          enum: [kinefx, biped, mixamo, unreal, fbx]
          default: kinefx
        height: {type: number, minimum: 0.01, default: 1.7}
        ground_z: {type: number, default: 0.0}
    next-tools:
      on-failure: [houdini_scene__get_node_info]
  - name: configure_biped_retarget
    description: >-
      Build a single-source biped retarget chain (Rig Match Pose -> Map Points
      -> Full Body IK) with an explicit cross-convention joint map. Fills
      workflow stage 4 (biped motion retarget). Complements the multi-clip
      build_retarget_motion_mixer by mapping differently named skeletons.
    source_file: scripts/configure_biped_retarget.py
    execution: async
    affinity: main
    timeout_hint_secs: 600
    group: retarget
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      additionalProperties: false
      required: [geo_path, target_skeleton, source_skeleton]
      properties:
        geo_path: {type: string, minLength: 1, description: Geometry SOP container path.}
        target_skeleton: {type: string, description: Target biped skeleton SOP path.}
        source_skeleton: {type: string, description: Source mocap skeleton SOP path.}
        source_convention:
          type: string
          enum: [kinefx, biped, mixamo, unreal, fbx]
          description: Source naming convention (with target_convention derives a map).
        target_convention:
          type: string
          enum: [kinefx, biped, mixamo, unreal, fbx]
          description: Target naming convention.
        joint_map:
          type: object
          additionalProperties: {type: string}
          description: "Explicit {source_name: target_name} map (takes precedence)."
        mapping_attribute: {type: string, default: retarget_joint}
        node_prefix: {type: string, default: dcc_mcp_biped_retarget}
    next-tools:
      on-failure: [houdini_scene__get_node_info]
  - name: invert_rig
    description: >-
      Rig inversion (workflow stage 5): recover parent-relative local joint
      transforms from a world-posed skeleton. Headless mode takes world_matrices
      + parent_indices (pure linear algebra); scene mode reads a KineFX
      skeleton's transform/P attributes and writes local transforms to a new
      skeleton SOP. Returns the computed local transforms.
    source_file: scripts/invert_rig.py
    execution: sync
    affinity: main
    group: rig
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      additionalProperties: false
      properties:
        rig_node:
          type: string
          description: KineFX skeleton SOP path (scene mode).
        world_matrices:
          type: array
          items:
            type: array
            items: {type: number}
            minItems: 16
            maxItems: 16
          description: 4x4 row-major world transforms (headless mode).
        parent_indices:
          type: array
          items: {type: integer}
          description: Parent index per joint (-1 for roots).
        output_name: {type: string, default: inverted_rig}
    next-tools:
      on-failure: [houdini_scene__get_node_info]
  - name: build_ragdoll
    description: >-
      Build a physics ragdoll setup from a biped skeleton (workflow stage 7):
      per-joint proxy colliders, a constraint network (cone-twist/point/glue),
      RBD solver, gravity, merge and output. Creates and cook-validates the
      setup network; a full simulation needs cook/output wiring by the caller.
    source_file: scripts/build_ragdoll.py
    execution: async
    affinity: main
    timeout_hint_secs: 600
    group: simulation
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      additionalProperties: false
      required: [geo_path, skeleton]
      properties:
        geo_path: {type: string, minLength: 1, description: Geometry SOP container path.}
        skeleton: {type: string, description: Biped skeleton SOP path (proxy points).}
        dopnet_path: {type: string, default: /obj/ragdoll_dopnet}
        node_prefix: {type: string, default: dcc_mcp_ragdoll}
        constraint_type:
          type: string
          enum: [conetwist, point, glue]
          default: conetwist
        add_ground: {type: boolean, default: true}
    next-tools:
      on-failure: [houdini_scene__get_node_info, houdini_simulation__inspect_simulation_network]
  - name: build_apex_fbx_biped
    description: >-
      Pack a Houdini 22 APEX biped character and report the engine-ready FBX
      export contract (workflow stage 8, KineFx APEX FBX biped template). Packs
      a biped skeleton + optional skinned mesh with a base biped rig and returns
      the exact export_fbx arguments (with unit conversion) and biped joint map.
    source_file: scripts/build_apex_fbx_biped.py
    execution: async
    affinity: main
    timeout_hint_secs: 600
    group: apex
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      additionalProperties: false
      required: [geo_path, skeleton]
      properties:
        geo_path: {type: string, minLength: 1, description: Geometry SOP container path.}
        skeleton: {type: string, description: Biped skeleton SOP path.}
        skinned_mesh: {type: string, description: Optional skinned/captured mesh SOP path.}
        character_name: {type: string, default: biped_character}
        convention:
          type: string
          enum: [kinefx, biped, mixamo, unreal, fbx]
          default: kinefx
        skel_path: {type: string, default: Base.skel}
        rig_path: {type: string, default: Base.rig}
        output_fbx: {type: string, description: Desired FBX output path.}
        node_prefix: {type: string, default: dcc_mcp_apex_biped}
    next-tools:
      on-failure: [houdini_scene__get_node_info, houdini_interchange__export_fbx]
