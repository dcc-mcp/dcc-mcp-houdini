tools:
  - name: inspect_gsplat_relighting_input
    description: >-
      Inspect a SOP GSplat output for the attributes needed by Labs normal
      reconstruction, delighting, Solaris relighting, and Copernicus
      rasterization. Detects both Houdini-native attributes and standard 3DGS
      PLY attributes that can be normalized with Bake GSplats. Read-only and
      bounded to attribute metadata and counts.
    source_file: scripts/inspect_gsplat_relighting_input.py
    execution: sync
    affinity: main
    group: gsplat-preflight
    read_only: true
    destructive: false
    idempotent: true
    tool_role: read_only
    risk: low
    search_aliases: [inspect gaussian splat, gsplat attributes, splat relighting preflight, gsplat albedo normals]
    produces: [gsplat_relighting_report]
    input_schema:
      type: object
      required: [node_path]
      properties:
        node_path:
          type: string
          description: Absolute Houdini SOP node path containing the GSplat points.
        max_attributes:
          type: integer
          minimum: 1
          maximum: 256
          default: 128
          description: Maximum point attributes to return.
        provenance_type:
          type: string
          enum: [captured, synthetic, unknown]
          default: unknown
          description: Origin of the splats; synthetic includes points sampled from procedural geometry.
        source_view_count:
          type: integer
          minimum: 0
          default: 0
          description: Number of source views from the same captured subject.
        camera_poses_solved:
          type: boolean
          default: false
          description: Whether source camera poses were reconstructed and retained.
        public_showcase:
          type: boolean
          default: false
          description: Enforce captured-GSplat provenance before allowing public showcase use.
    next-tools:
      on-success:
        - houdini_gsplat_relighting__prepare_gsplat_sop_chain
      on-failure:
        - houdini_scene__get_node_info

  - name: prepare_gsplat_sop_chain
    description: >-
      Append the installed Labs Normals from GSplats and/or Delight GSplats
      SOPs to an existing GSplat output. Standard 3DGS PLY inputs are first
      normalized with Houdini's Bake GSplats SOP. Preserves the source,
      returns actual node paths and output attributes, and rolls back newly
      created nodes if the chain cannot be built.
    source_file: scripts/prepare_gsplat_sop_chain.py
    execution: sync
    affinity: main
    group: gsplat-prep
    read_only: false
    destructive: false
    idempotent: false
    risk: medium
    search_aliases: [prepare gsplat, generate splat normals, extract splat albedo, delight gaussian splat]
    produces: [gsplat_sop_chain]
    input_schema:
      type: object
      required: [node_path]
      properties:
        node_path:
          type: string
          description: Absolute Houdini SOP node path containing the source GSplats.
        create_normals:
          type: boolean
          default: true
          description: Append Labs Normals from GSplats.
        create_albedo:
          type: boolean
          default: true
          description: Append Labs Delight GSplats, which writes the albedo attribute.
        normalize_input:
          type: boolean
          default: true
          description: Insert Houdini Bake GSplats when standard 3DGS PLY attributes are detected.
        preserve_spherical_harmonics:
          type: boolean
          default: true
          description: Convert f_rest coefficients to GS_SPH_R/G/B when the source provides them.
        name_prefix:
          type: string
          default: gsplat_relight
          description: Prefix for generated node names.
        cook:
          type: boolean
          default: true
          description: Cook the final generated SOP after wiring it.
    next-tools:
      on-success:
        - houdini_gsplat_relighting__create_gsplat_relight_lop
      on-failure:
        - houdini_node_graph__get_connections

  - name: create_gsplat_relight_lop
    description: >-
      Create and connect a Labs Relight GSplats LOP after a Solaris input,
      optionally adding USD Light LOPs for a key, fill, dome, or other relight
      lights. Applies only parameters that exist in the installed Houdini/Labs
      build, reports unsupported version-specific names, and when available
      exposes the relit points through a stable SOP bridge instead of requiring
      consumers to address Labs HDA internals.
    source_file: scripts/create_gsplat_relight_lop.py
    execution: sync
    affinity: main
    group: gsplat-solaris
    read_only: false
    destructive: false
    idempotent: false
    risk: medium
    search_aliases: [relight gsplat in solaris, labs relight gsplats, usd gsplat lights, gsplat shadow bias]
    produces: [gsplat_relight_stage]
    input_schema:
      type: object
      additionalProperties: false
      required: [lop_node_path]
      properties:
        lop_node_path:
          type: string
          description: Absolute Solaris LOP node providing the GSplat stage.
        camera_path:
          type: string
          description: Optional USD/Houdini camera path used for specular relighting.
        collision_path:
          type: string
          description: Optional SOP/LOP collision geometry path for shadow rays.
        enable_shadows:
          type: boolean
          default: true
          description: Enable GSplat shadow tracing when supported.
        shadow_bias:
          type: number
          minimum: 0
          description: Optional manual shadow bias override.
        lights:
          type: array
          description: Optional USD Light LOP specs; each item has name, type, intensity, color, exposure, prim_path, and environment_texture.
          items:
            type: object
            required: [name, type]
            properties:
              name: {type: string}
              type: {type: string, enum: [Dome, Distant, Sphere, Rectangle, Disk, Cylinder, Point]}
              prim_path: {type: string}
              intensity: {type: number}
              exposure: {type: number}
              color: {type: array, items: {type: number}, minItems: 3, maxItems: 3}
              environment_texture: {type: string}
        parameters:
          type: object
          description: Optional exact Labs parameter overrides for the installed build.
        create_sop_bridge:
          type: boolean
          default: true
          description: >-
            Discover the compatible relit SOP inside the Labs asset and expose
            it through a stable object-level SOP bridge.
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success: {type: boolean}
        message: {type: string}
        context:
          type: object
          required: [relight, sop_bridge_available, sop_output_path, point_count, gsplat_attributes]
          properties:
            relight: {type: object}
            sop_bridge_available: {type: boolean}
            sop_output_path: {type: [string, "null"]}
            point_count: {type: integer, minimum: 0}
            gsplat_attributes:
              type: array
              items: {type: string}
            bridge_refreshed: {type: boolean}
            sop_bridge_status: {type: string}
            sop_bridge_error_type: {type: [string, "null"]}
    next-tools:
      on-success:
        - houdini_gsplat_relighting__refresh_gsplat_relight_sop_bridge
        - houdini_usd_lops__list_stage_prims
        - houdini_parameters__get_parms
      on-failure:
        - houdini_scene__get_node_info

  - name: refresh_gsplat_relight_sop_bridge
    description: >-
      Force-cook an existing Labs Relight GSplats LOP, rediscover its compatible
      SOP output without relying on an internal HDA path, update the stable
      object-level bridge, and return its output path, point count, and key
      GSplat attributes. Use after changing Dome or relight parameters.
    source_file: scripts/refresh_gsplat_relight_sop_bridge.py
    execution: sync
    affinity: main
    group: gsplat-solaris
    read_only: false
    destructive: false
    idempotent: true
    tool_role: mutation
    risk: medium
    search_aliases: [refresh relit gsplat sop, recook dome relight, solaris sop bridge, update gsplat lighting]
    produces: [gsplat_relight_sop_bridge]
    input_schema:
      type: object
      additionalProperties: false
      required: [relight_lop_path]
      properties:
        relight_lop_path:
          type: string
          pattern: ^/
          description: Absolute path to the Labs Relight GSplats LOP returned by the setup tool.
        force:
          type: boolean
          default: true
          description: Force-cook the relight LOP, discovered source SOP, and stable bridge nodes.
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success: {type: boolean}
        message: {type: string}
        context:
          type: object
          required: [sop_output_path, point_count, gsplat_attributes, bridge_refreshed]
          properties:
            sop_output_path: {type: string}
            point_count: {type: integer, minimum: 1}
            gsplat_attributes:
              type: array
              items: {type: string}
            bridge_refreshed: {type: boolean}
            sop_bridge_available: {type: boolean}
            sop_bridge_status: {type: string}
            relight: {type: object}
    call_examples:
      - arguments:
          relight_lop_path: /stage/gsplat_relight
          force: true
        note: Recompute the stable relit SOP after changing Dome-light parameters.
    next-tools:
      on-success:
        - houdini_gsplat_relighting__create_gsplat_copernicus_raster
      on-failure:
        - houdini_scene__get_node_info

  - name: create_gsplat_copernicus_raster
    description: >-
      Create a Copernicus SOP Import plus Rasterize GSplats chain, optionally
      wiring a Camera Import COP and Sharpen, HSV, Gamma, and Premult image
      refinement nodes. An optional absolute background image is composited by
      a File COP and Blend COP using the H22 named bg/fg input contract. Enables
      external-SOP mode, applies the native resolution contract, and reports
      every created output.
    source_file: scripts/create_gsplat_copernicus_raster.py
    execution: sync
    affinity: main
    group: gsplat-copernicus
    read_only: false
    destructive: false
    idempotent: false
    risk: medium
    search_aliases: [rasterize gsplats, copernicus gsplat, camera rasterize splat, gsplat image refinement]
    produces: [gsplat_copernicus_chain]
    input_schema:
      type: object
      additionalProperties: false
      required: [copnet_path, sop_path]
      properties:
        copnet_path:
          type: string
          description: Absolute Copernicus COP network path, normally under /img.
        sop_path:
          type: string
          description: Absolute SOP path of the prepared or relit GSplats.
        camera_path:
          type: string
          description: Optional Houdini camera path for Camera Import COP.
        attribute_name:
          type: string
          default: Cd
          description: GSplat output attribute to rasterize.
        resolution:
          type: array
          items: {type: integer, minimum: 1}
          minItems: 2
          maxItems: 2
          description: Optional COP network resolution hint.
        sharpen_amount:
          type: number
          minimum: 0
          description: Optional Sharpen COP amplitude.
        saturation_scale:
          type: number
          minimum: 0
          description: Optional HSV saturation multiplier.
        value_scale:
          type: number
          minimum: 0
          description: Optional HSV value/brightness multiplier.
        gamma:
          type: number
          exclusiveMinimum: 0
          description: Optional Gamma COP value.
        premultiply_alpha:
          type: boolean
          default: false
          description: >-
            Append a Premult COP only for an explicit straight-alpha downstream
            contract. Rasterize GSplats output is already alpha-associated, so
            enabling this by default would darken translucent splats twice.
        background_image_path:
          type: string
          minLength: 1
          description: >-
            Optional absolute HDR or image path loaded by a Houdini 22 File COP.
            The path is consumed by Houdini but is not echoed in the public result.
        background_mode:
          type: string
          enum: [over]
          default: over
          description: >-
            Bounded Blend COP composite mode. The GSplat output is connected to
            named fg and the background File COP to named bg.
        background_brightness:
          type: number
          minimum: 0.01
          maximum: 16.0
          default: 1.0
          description: >-
            Linear brightness multiplier applied only to the camera-projected
            background branch, without changing Solaris relighting exposure.
        background_rotation:
          type: array
          items: {type: number}
          minItems: 3
          maxItems: 3
          default: [0.0, 0.0, 0.0]
          description: >-
            Camera-visible HDR sphere rotation as [rx, ry, rz] degrees. Use the
            same rotation on the Solaris Dome Light to keep lighting and plate
            directions physically consistent.
    next-tools:
      on-success:
        - houdini_gsplat_relighting__write_gsplat_copernicus_image
        - houdini_parameters__set_parms
        - houdini_render__capture_viewport
      on-failure:
        - houdini_scene__get_node_info

  - name: write_gsplat_copernicus_image
    description: >-
      Render one existing Copernicus output through a clearly named Houdini 22
      Image ROP under /out. Clears any default output expression before setting
      the caller-provided absolute file, performs a synchronous foreground
      render for one frame, and accepts the result only when the file was
      created or updated with non-zero bytes.
    source_file: scripts/write_gsplat_copernicus_image.py
    execution: sync
    affinity: main
    group: gsplat-copernicus
    read_only: false
    destructive: true
    idempotent: true
    tool_role: mutation
    risk: medium
    search_aliases: [write gsplat pixels, copernicus image rop, render cop to disk, verify gsplat image]
    produces: [gsplat_pixel_evidence]
    input_schema:
      type: object
      additionalProperties: false
      required: [cop_output_path, output_file, frame, resolution, color_conversion]
      properties:
        cop_output_path:
          type: string
          pattern: ^/
          description: Absolute path to the existing Copernicus output node to render.
        output_file:
          type: string
          minLength: 1
          description: Absolute image file path. An existing file may be overwritten.
        frame:
          type: number
          minimum: -1000000
          maximum: 1000000
          description: Single frame to render synchronously in the current Houdini process.
        resolution:
          type: array
          items: {type: integer, minimum: 1, maximum: 16384}
          minItems: 2
          maxItems: 2
          description: Image ROP default resolution as [width, height].
        color_conversion:
          type: string
          enum: [raw, ocio, bakeocio]
          description: Houdini 22 Image ROP Colorspace Conversion token.
        rop_name:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
          default: dcc_mcp_gsplat_image_proof
          description: Fixed child name to create or reuse directly under /out.
    output_schema:
      type: object
      required: [success, message, context]
      properties:
        success: {type: boolean}
        message: {type: string}
        context:
          type: object
          required: [written_files, output_evidence, image_rop, created, frame, resolution, color_conversion]
          properties:
            written_files:
              type: array
              items: {type: string}
            output_evidence:
              type: object
              required: [exists, size_bytes, updated_by_render]
              properties:
                exists: {type: boolean}
                size_bytes: {type: integer, minimum: 0}
                updated_by_render: {type: boolean}
            image_rop: {type: object}
            created: {type: boolean}
            cop_output_path: {type: string}
            frame: {type: number}
            resolution:
              type: array
              items: {type: integer}
              minItems: 2
              maxItems: 2
            color_conversion: {type: string}
    call_examples:
      - arguments:
          cop_output_path: /img/gsplat_final/OUT
          output_file: D:/renders/gsplat-proof.exr
          frame: 48
          resolution: [1280, 720]
          color_conversion: raw
        note: Write one linear EXR frame and verify the file was freshly produced.
    next-tools:
      on-failure:
        - houdini_scene__get_node_info
