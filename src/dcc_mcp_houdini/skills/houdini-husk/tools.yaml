tools:
  - name: render_with_husk
    description: >-
      Launch a USD render in an isolated Husk worker and return a durable
      job_id immediately. Supports frame range, resolution, and custom CLI
      args without occupying Houdini's UI thread.
    source_file: scripts/render_with_husk.py
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    group: render
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      required: [usd_file, output_path]
      properties:
        usd_file:
          type: string
        output_path:
          type: string
        renderer:
          type: string
          default: karma
        frame:
          type: integer
        frame_range:
          type: array
          items: {type: number}
          minItems: 2
          maxItems: 3
        resolution:
          type: array
          items: {type: integer}
          minItems: 2
          maxItems: 2
        husk_args:
          type: array
          items: {type: string}
        use_hython_fallback:
          type: boolean
          default: false
          description: >-
            Deprecated safety flag. True is rejected because in-process
            rendering can block Houdini's UI thread.
  - name: get_husk_job
    description: >-
      Poll a durable isolated Husk render. Returns state, elapsed time,
      verified output files, bounded stdout/stderr tails, and worker ownership.
    source_file: scripts/get_husk_job.py
    execution: sync
    affinity: any
    timeout_hint_secs: 10
    group: render
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
    input_schema:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
  - name: cancel_husk_job
    description: >-
      Cancel an adapter-owned Husk worker process tree. Repeated calls are
      safe; jobs no longer owned by this adapter are never signalled.
    source_file: scripts/cancel_husk_job.py
    execution: sync
    affinity: any
    timeout_hint_secs: 10
    group: render
    read_only: false
    destructive: true
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: true
    input_schema:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
  - name: create_checkpoint
    description: >-
      Create a render checkpoint for husk — save intermediate USD state for
      resume after interruption. Supports Solaris LOPs and file-based workflows.
    source_file: scripts/create_checkpoint.py
    execution: sync
    affinity: main
    group: checkpoint
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      required: [usd_file, checkpoint_path]
      properties:
        usd_file:
          type: string
        checkpoint_path:
          type: string
        frame:
          type: integer
  - name: create_snapshot
    description: >-
      Export the current Solaris stage (/stage) or LOP network as a USD snapshot
      for husk command-line rendering. Uses Houdini's USD ROP internally.
    source_file: scripts/create_snapshot.py
    execution: sync
    affinity: main
    group: checkpoint
    read_only: false
    destructive: false
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: false
    input_schema:
      type: object
      properties:
        source_path:
          type: string
          default: /stage
        snapshot_path:
          type: string
          default: /tmp/husk_snapshot.usd
        flatten:
          type: boolean
          default: false
        frame:
          type: number
  - name: set_husk_options
    description: >-
      Configure or inspect husk command-line rendering options (renderer,
      threads, GPU, resolution, output, debug flags). Apply to LOP/ROP nodes
      or list the option catalog.
    source_file: scripts/set_husk_options.py
    execution: sync
    affinity: main
    group: options
    read_only: false
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
    input_schema:
      type: object
      properties:
        node_path:
          type: string
        options:
          type: object
          description: "Key-value pairs of husk CLI options to apply"
        list_options:
          type: boolean
          default: false
        category:
          type: string
          enum: [render, output, frame, debug, performance]
