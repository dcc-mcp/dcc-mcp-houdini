tools:
  - name: export_model_state
    description: >-
      Export bounded dcc-mcp/model-state@1 evidence for one cooked Houdini SOP
      node. Includes hierarchy, topology counts, UV/material facts, bounds,
      and explicit partial or unavailable markers for host-limited checks.
    source_file: scripts/export_model_state.py
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    group: modeling-validation
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false
    input_schema:
      type: object
      additionalProperties: false
      required: [node_path]
      properties:
        node_path:
          type: string
          minLength: 1
          description: Cooked SOP node path to inspect.
    output_schema:
      type: object
      required: [success]
      properties:
        success: {type: boolean}
        message: {type: string}
        context:
          type: object
          additionalProperties: true
