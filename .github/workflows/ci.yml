name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release-please--branches--**"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DCC_MCP_CORE_FLOOR: "0.20.14"
  # Commit in dcc-mcp-core that defines the shared VFX Platform baseline. Pinned
  # rather than tracking a branch: the baseline is the source of truth for a hard
  # gate, so it must not change under an adapter build without an explicit bump.
  DCC_MCP_CORE_BASELINE_REF: "7551a647992ee20897c3000dcc310c3160e1e11b"

jobs:
  lint:
    name: Lint and Skill Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dcc-mcp-core==${DCC_MCP_CORE_FLOOR}"
          python -m pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/ tests/ tools/ packaging/
      - name: Ruff format check
        run: ruff format --check src/ tests/ tools/ packaging/
      - uses: actions/checkout@v6
        with:
          repository: dcc-mcp/dcc-mcp-agent-plugins
          ref: 54b9d46a9fcefab1ed3a6aafc18da6ab4198ad25
          path: .agent-plugins
      - name: Check Agent quickstart
        run: >-
          python .agent-plugins/scripts/sync_adapter_readme.py
          --repository ${{ github.event.repository.name }}
          --readme README.md
          --check
      - name: Install dcc-mcp-cli (runtime skill validator)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/install_dcc_mcp_cli.py
      - name: Validate bundled skills (dcc-mcp-cli)
        run: python tools/lint_skills.py --require-cli --warnings-as-errors
      - name: Python 3.7 syntax check
        run: python tools/check_py37_syntax.py src tests tools packaging

      - name: Check declared dependencies against the VFX Platform baseline
        run: |
          set -euo pipefail
          # Installed explicitly so this step does not silently rely on
          # packaging arriving as a transitive dev dependency.
          pip install "packaging>=23.0"
          base="https://raw.githubusercontent.com/dcc-mcp/dcc-mcp-core/${DCC_MCP_CORE_BASELINE_REF}"
          mkdir -p .vfx-baseline
          # A missing file must fail loudly rather than leave the gate unenforced.
          curl -fsSL "${base}/config/vfx-platform-baseline.json" -o .vfx-baseline/baseline.json
          curl -fsSL "${base}/scripts/ci/check_vfx_baseline.py" -o .vfx-baseline/check_vfx_baseline.py
          python .vfx-baseline/check_vfx_baseline.py \
            --baseline .vfx-baseline/baseline.json \
            --pyproject pyproject.toml

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dcc-mcp-core==${DCC_MCP_CORE_FLOOR}"
          python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest
      - name: Install lifecycle smoke
        run: python -m pytest tests/test_install_lifecycle.py

  # Every other job pins Core to DCC_MCP_CORE_FLOOR, which keeps the matrix reproducible but
  # also holds it at 0.20.14 -- a Core minor that breaks the Install SOP contract (0.20.34
  # bumped the schema artifact revision) is invisible until someone bumps the pin. This job
  # deliberately runs against the newest published Core, including versions the pin excludes.
  core-latest:
    name: core-latest compatibility
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve newest Core
        id: core
        run: |
          python -m pip install --upgrade pip
          version=$(python -m pip index versions dcc-mcp-core \
            | tr ',' '\n' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          # Fail loudly here rather than silently testing an empty pin: this job exists only
          # to warn about new Core releases, so a run that resolved nothing would otherwise
          # still report success.
          if [ -z "${version}" ]; then
            echo "::error::could not resolve newest dcc-mcp-core version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved dcc-mcp-core ${version}"

      - name: Install adapter with newest Core
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade "dcc-mcp-core==${{ steps.core.outputs.version }}"
          python -m pip show dcc-mcp-core

      - name: Install SOP contract against newest Core
        run: python -m pytest tests/test_install_lifecycle.py -v --tb=short

  build:
    name: Build Wheel and Sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build package
        run: python -m build
      - name: Verify wheel contains bundled skills
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = sorted(glob.glob("dist/dcc_mcp_houdini-*.whl"))
          assert wheels, "wheel missing"
          with zipfile.ZipFile(wheels[-1]) as zf:
              names = set(zf.namelist())
          required = {
              "dcc_mcp_houdini/_isolated_jobs.py",
              "dcc_mcp_houdini/_rop_jobs.py",
              "dcc_mcp_houdini/skills/houdini-render/scripts/_render_worker.py",
              "dcc_mcp_houdini/skills/houdini-scene/SKILL.md",
              "dcc_mcp_houdini/skills/houdini-nodes/SKILL.md",
              "dcc_mcp_houdini/skills/houdini-materials/SKILL.md",
          }
          missing = sorted(required - names)
          assert not missing, missing
          assert "dcc_mcp_houdini/_install_contract.py" not in names
          PY
      - name: Verify installed wheel uses published Core schema
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install "dcc-mcp-core==${DCC_MCP_CORE_FLOOR}" dist/*.whl
          .wheel-smoke/bin/python - <<'PY'
          import sys

          from dcc_mcp_core.deployment import load_install_sop_schema

          # One source of truth with the unit suite: the measured Install SOP revisions live in
          # tests/install_sop_anchors.py, keyed by the Core release that shipped each one.
          sys.path.insert(0, "tests")
          from install_sop_anchors import core_schema_anchor, core_schema_artifact
          from install_sop_anchors import installed_core_version

          schema = load_install_sop_schema()
          # core_schema_artifact() matches the artifact by parsed document, so finding it also
          # proves Core serves exactly the document load_install_sop_schema() returned.
          observed = core_schema_artifact(schema)
          assert observed is not None, "Could not locate the Install SOP schema artifact served by Core"
          anchor = core_schema_anchor(installed_core_version() or "")
          if anchor is not None:
              assert observed == anchor
          import dcc_mcp_houdini._installer
          PY
      - name: Check package
        run: python -m twine check dist/*
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  quickinstall:
    name: Build Houdini Quickinstall (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [win64, linux, macos]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install --upgrade pip build packaging pytest
      - name: Build wheel
        run: python -m build
      - name: Assemble quickinstall ZIP
        run: python packaging/assemble_houdini_package.py --platform ${{ matrix.platform }} --dist-dir dist --output-dir dist_houdini --core-version "$DCC_MCP_CORE_FLOOR"
      - name: Verify quickinstall version matrix
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          zip_path="$(ls dist_houdini/dcc_mcp_houdini_quickinstall_${PLATFORM}_v*.zip | tail -n 1)"
          python packaging/assemble_houdini_package.py --platform "$PLATFORM" --verify-zip "$zip_path" --expected-core-version "$DCC_MCP_CORE_FLOOR"
      - name: Upload quickinstall artifact
        uses: actions/upload-artifact@v7
        with:
          name: houdini-quickinstall-${{ matrix.platform }}
          path: dist_houdini/*.zip
